<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Basic · Гурток — Теми занять</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7FB; --ink:#1B1B3A; --ink-soft:#4F5A72; --surface:#FFFFFF; --line:#DFE6F1;
    --py-blue:#3776AB; --py-blue-dark:#25567F; --py-yellow:#FFD43B; --py-soft:#E8F0F8;
    --radius-s:10px; --radius-m:16px; --radius-l:26px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Nunito Sans',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.headline{font-family:'Baloo 2',sans-serif; font-weight:700; margin:0; color:var(--ink); text-wrap:balance;}
  p,.lesson-title,.lesson-note{text-wrap:pretty;}
  a{color:inherit;}
  .container{max-width:820px; margin:0 auto; padding:0 24px;}

  .topbar{padding:18px 24px; border-bottom:1px solid var(--line); background:rgba(244,247,251,.9); position:sticky; top:0; backdrop-filter:blur(6px); z-index:2;}
  .topbar-inner{max-width:820px; margin:0 auto;}
  .back-link{font-family:'Baloo 2',sans-serif; font-weight:600; font-size:14px; color:var(--py-blue-dark); text-decoration:none;}
  .back-link:hover{text-decoration:underline;}

  .hero{padding:40px 24px 28px; display:flex; align-items:center; gap:24px;}
  .hero-text{flex:1; min-width:0;}
  .hero-eyebrow{font-family:'Baloo 2',sans-serif; font-size:14px; font-weight:600; color:var(--py-blue-dark); margin-bottom:8px;}
  .hero h1{font-size:30px; line-height:1.2; margin-bottom:10px;}
  .hero p{color:var(--ink-soft); font-size:15.5px; max-width:60ch; margin:0;}
  .hero svg{flex-shrink:0; width:120px; height:120px;}
  @media (max-width:560px){ .hero svg{display:none;} }

  .theme-card{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-l); padding:20px 22px; margin-bottom:18px;}
  .theme-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px; flex-wrap:wrap;}
  .theme-head h2{font-size:17px;}
  .theme-hours{font-family:'Baloo 2',sans-serif; font-weight:600; font-size:12.5px; color:var(--ink-soft); background:var(--bg); border-radius:999px; padding:3px 10px; white-space:nowrap;}

  .lesson-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line);}
  .lesson-row:first-of-type{border-top:none;}
  .lesson-num{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:var(--ink-soft); width:22px; flex-shrink:0;}
  .lesson-body{flex:1; min-width:0;}
  .lesson-title{font-size:14.5px;}
  .lesson-note{font-size:13px; color:var(--ink-soft); line-height:1.45;}
  .lesson-note code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; background:var(--py-soft); color:var(--py-blue-dark); padding:1px 5px; border-radius:5px;}
  .kind{display:inline-block; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:11px; line-height:1; padding:4px 8px; border-radius:999px; margin-right:6px; vertical-align:2px;}
  .kind.practice{background:#FFF4CC; color:#7A5B00;}
  .kind.project{background:#FDE3EC; color:#9B1D4C;}
  .lesson-action{flex-shrink:0; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .btn-open{font-family:'Baloo 2',sans-serif; font-weight:600; font-size:13px; background:var(--py-blue); color:#fff; text-decoration:none; padding:8px 14px; border-radius:999px; white-space:nowrap; transition:background .15s ease;}
  .btn-open:hover{background:var(--py-blue-dark);}
  .btn-practice{font-family:'Baloo 2',sans-serif; font-weight:600; font-size:13px; background:var(--surface); color:var(--py-blue-dark); border:1.5px solid var(--py-blue); text-decoration:none; padding:6.5px 13px; border-radius:999px; white-space:nowrap; transition:background .15s ease;}
  .btn-practice:hover{background:var(--py-soft);}
  .tag-soon{font-family:'Baloo 2',sans-serif; font-weight:600; font-size:12px; color:var(--ink-soft); background:var(--bg); border:1px solid var(--line); padding:6px 12px; border-radius:999px; white-space:nowrap;}

  footer{padding:36px 24px 60px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
</style>
</head>
<body>

<div class="topbar"><div class="topbar-inner"><a class="back-link" href="../index.html">← Усі класи</a></div></div>

<section class="hero container">
  <div class="hero-text">
    <div class="hero-eyebrow">Гурток · Програмування мовою Python</div>
    <h1>Python Basic</h1>
    <p>Від першої програми до власних ігор, малюнків у Turtle й пристроїв на Micro:bit. 5 модулів, 34 заняття.</p>
  </div>
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <rect x="8" y="14" width="104" height="80" rx="14" fill="#25567F"/>
    <rect x="8" y="14" width="104" height="18" rx="9" fill="#1B3F5E"/>
    <circle cx="22" cy="23" r="3.5" fill="#FF6B4A"/><circle cx="33" cy="23" r="3.5" fill="#FFD43B"/><circle cx="44" cy="23" r="3.5" fill="#5BD08A"/>
    <path d="M22 50 L32 58 L22 66" fill="none" stroke="#FFD43B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="62" width="22" height="5" rx="2.5" fill="#fff"/>
    <path d="M70 106 Q70 90 84 90 H96 Q108 90 108 78 V66" fill="none" stroke="#FFD43B" stroke-width="11" stroke-linecap="round"/>
    <circle cx="108" cy="62" r="9" fill="#FFD43B"/>
    <circle cx="111" cy="60" r="2" fill="#1B1B3A"/>
  </svg>
</section>

<div class="container" id="plan"></div>

<footer>Гурток · Python Basic · Інтерактивні заняття</footer>

<script>
// kind: 'practice' — практикум, 'project' — проєкт; note — короткий зміст заняття
const PLAN = [
  { title: "1. Основи та алгоритми", hours: "10 год", lessons: [
    { title: "Вступ до Python. Перша програма", link: "lesson-first-program/index.html", note: "Що таке програмування, середовище розробки, <code>print()</code>, коментарі" },
    { title: "Змінні, типи даних і введення", note: "<code>int</code>, <code>float</code>, <code>str</code>, <code>bool</code>, <code>input()</code>, перетворення <code>int(input())</code>, f-рядки" },
    { title: "Арифметичні оператори", note: "<code>+ - * /</code>, <code>//</code> і <code>%</code>, пріоритет операцій, <code>+</code> і <code>*</code> для рядків" },
    { title: "Умови: if, elif, else", note: "Оператори порівняння, <code>and</code>, <code>or</code>, <code>not</code>" },
    { title: "Логічні ігри", kind: "practice", note: "Гра «Вгадай число» або вікторина" },
    { title: "Цикл while", note: "Умова продовження, нескінченні цикли, <code>break</code>" },
    { title: "Задачі на цикл while", kind: "practice", note: "Меню, лічильник, перевірка введення" },
    { title: "Цикл for і range()", note: "Перебір чисел: старт, стоп, крок" },
    { title: "Задачі на цикл for", kind: "practice", note: "Зворотний відлік, накопичення суми" },
    { title: "Комбіновані цикли", kind: "practice", note: "for і while в одній програмі" }
  ]},
  { title: "2. Робота зі списками", hours: "6 год", lessons: [
    { title: "Що таке список. Створення й додавання", note: "Створення списку, <code>.append()</code>" },
    { title: "Цикл for і списки", note: "Перегляд усіх елементів, <code>len()</code>, <code>sum()</code>, <code>min()</code>, <code>max()</code>" },
    { title: "Зміна та видалення елементів", note: "<code>pop()</code>, <code>remove()</code>, <code>del</code>" },
    { title: "Пошук у списку", note: "Чи є елемент і де він стоїть" },
    { title: "Сортування списку", note: "За алфавітом і за зростанням" },
    { title: "Електронний кошик покупок", kind: "project", note: "Додати, переглянути й видалити товар" }
  ]},
  { title: "3. Функції та вбудовані модулі", hours: "5 год", lessons: [
    { title: "Функції: основи", note: "<code>def</code>, параметри, <code>return</code>" },
    { title: "Функції: область видимості", note: "Локальні й глобальні змінні, виклик функції з функції" },
    { title: "Модуль random", note: "<code>import</code>, <code>randint()</code>, <code>choice()</code>" },
    { title: "Модуль math", note: "<code>sqrt()</code>, <code>pow()</code>, <code>math.pi</code>" },
    { title: "Генератор паролів", kind: "project", note: "Функції, списки й random разом" }
  ]},
  { title: "4. Малюємо з Turtle", hours: "7 год", lessons: [
    { title: "Turtle: основи руху", note: "Квадрат, трикутник, кути повороту" },
    { title: "Колір і товщина ліній", note: "Будиночок чи дорога різними кольорами" },
    { title: "Цикли й многокутники", note: "for для повторюваних фігур" },
    { title: "Turtle і функції", note: "Власні функції для складних малюнків" },
    { title: "Координати й позиціонування", note: "<code>goto()</code>, <code>setx()</code>, <code>sety()</code>, <code>home()</code>" },
    { title: "Заливка кольором", note: "<code>begin_fill()</code> і <code>end_fill()</code>" },
    { title: "Turtle Art", kind: "project", note: "Рух, цикли, функції й колір в одному малюнку" }
  ]},
  { title: "5. Micro:bit і MicroPython", hours: "6 год", lessons: [
    { title: "Знайомство з Micro:bit", note: "Що таке MicroPython, середовище" },
    { title: "Кнопки A і B", note: "Обробка натискань" },
    { title: "Акселерометр і рух", note: "Визначення нахилу плати" },
    { title: "Сенсори температури й освітленості", note: "Читання даних із вбудованих сенсорів" },
    { title: "Радіозв'язок", note: "Обмін повідомленнями між платами" },
    { title: "Крокомір або компас", kind: "project", note: "Сенсори, кнопки й логіка разом" }
  ]}
];

const KIND = { practice: "Практикум", project: "Проєкт" };
const root = document.getElementById('plan');
let n = 0;
PLAN.forEach(theme=>{
  const card = document.createElement('div');
  card.className = 'theme-card';
  const head = document.createElement('div');
  head.className = 'theme-head';
  head.innerHTML = `<h2>${theme.title}</h2><span class="theme-hours">${theme.hours}</span>`;
  card.appendChild(head);

  theme.lessons.forEach(lesson=>{
    n++;
    const row = document.createElement('div');
    row.className = 'lesson-row';
    const kind = lesson.kind ? `<span class="kind ${lesson.kind}">${KIND[lesson.kind]}</span>` : '';
    const action = (lesson.practice ? `<a class="btn-practice" href="${lesson.practice.link}" title="${lesson.practice.title}">Практикуємо</a>` : '')
      + (lesson.link
        ? `<a class="btn-open" href="${lesson.link}">Вчимося</a>`
        : `<span class="tag-soon">Скоро</span>`);
    row.innerHTML = `
      <span class="lesson-num">${n}</span>
      <div class="lesson-body">
        <div class="lesson-title">${kind}${lesson.title}</div>
        ${lesson.note ? `<div class="lesson-note">${lesson.note}</div>` : ''}
      </div>
      <div class="lesson-action">${action}</div>`;
    card.appendChild(row);
  });
  root.appendChild(card);
});
</script>

</body>
</html>
