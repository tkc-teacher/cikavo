<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конструктор аватарів · Лабораторія</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5FB; --ink:#1B1B3A; --ink-soft:#514F72; --surface:#FFFFFF; --line:#E4E1F5;
    --purple:#6C5CE7; --purple-dark:#5340c9; --teal:#16A3A0; --teal-dark:#0E7C7A; --teal-soft:#E3F7F6; --coral:#FF6B4A;
    --yellow:#FFC93C; --pink:#FF5D9E; --blue:#2D9CDB;
    --radius-s:10px; --radius-m:16px; --radius-l:26px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Nunito Sans',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Baloo 2',sans-serif; font-weight:700; margin:0; color:var(--ink);}
  button{font:inherit;}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky; top:0; z-index:10; background:rgba(246,245,251,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1100px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px;}
  .back-link{font-family:'Baloo 2',sans-serif; font-weight:600; font-size:14px; color:var(--teal-dark); text-decoration:none; white-space:nowrap;}
  .back-link:hover{text-decoration:underline;}
  .game-title{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---------- Layout ---------- */
  .maker{max-width:1100px; margin:0 auto; padding:24px 16px 48px; display:grid; grid-template-columns:minmax(280px,380px) 1fr; gap:28px; align-items:start;}
  .stage{position:sticky; top:72px; display:flex; flex-direction:column; align-items:center; gap:16px; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-l); padding:24px 20px;}
  .stage h1{font-size:24px; line-height:1.2; text-align:center;}
  /* Курсор-підказка «клацни мене» — до першого клацання (лише в пам'яті сторінки, нічого не зберігається) */
  .tap-hint{position:absolute; right:8%; top:7%; width:52px; height:52px; pointer-events:none; opacity:.85; transition:opacity .3s ease;}
  .tap-hint svg{position:absolute; left:0; top:0; width:52px; height:52px; filter:drop-shadow(0 3px 4px rgba(27,27,58,.3)); animation:tap 1.8s ease-in-out infinite;}
  .tap-hint .ripple{position:absolute; left:8px; top:-10px; width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px rgba(22,163,160,.5); opacity:0; animation:ripple 1.8s ease-out infinite;}
  .tap-hint.gone{opacity:0;}
  @keyframes tap{0%,100%{transform:translate(4px,10px);} 40%,55%{transform:translate(0,0) scale(.9);}}
  @keyframes ripple{0%,40%{opacity:0; transform:scale(.4);} 45%{opacity:1;} 80%,100%{opacity:0; transform:scale(1.5);}}
  @media (max-width:760px){ .tap-hint{transform:scale(.7); transform-origin:100% 0;} }
  .avatar-wrap{position:relative; width:min(300px, 100%); aspect-ratio:1; cursor:pointer; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
  .avatar-wrap > svg{width:100%; height:100%; display:block; border-radius:var(--radius-l); filter:drop-shadow(0 6px 14px rgba(27,27,58,.12));}
  .avatar-wrap.round > svg{border-radius:50%;}
  .avatar-wrap.bounce > svg{animation:bounce .5s ease;}
  @keyframes bounce{30%{transform:translateY(-10px) scale(1.03,.97);} 60%{transform:translateY(0) scale(.98,1.02);}}
  .bubble{position:absolute; top:-6px; right:-8px; background:var(--ink); color:#fff; font-family:'Baloo 2',sans-serif; font-weight:600; font-size:14px; padding:4px 12px; border-radius:14px 14px 14px 4px; opacity:0; transform:translateY(6px) scale(.9); transition:all .2s ease; pointer-events:none; white-space:nowrap; -webkit-user-select:none; user-select:none;}
  .bubble.show{opacity:1; transform:none;}

  /* Анімація «живого» аватара: кліпання й погляд за курсором */
  .live .blink{animation:blink 4.2s infinite; transform-box:fill-box; transform-origin:center;}
  .live .pupil{transform:translate(calc(var(--px,0) * 1px), calc(var(--py,0) * 1px)); transition:transform .12s ease-out;}
  @keyframes blink{0%,93%,100%{transform:scaleY(1);} 96%{transform:scaleY(.08);}}
  /* Легкі «живі» рухи — лише у великому аватарі (клас live), мініатюри й збережена картинка статичні */
  .live .a-sway{animation:sway 3.8s ease-in-out infinite; transform-box:view-box; transform-origin:100px 70px;}
  .live .a-ears{animation:twitch 5.5s ease-in-out infinite; transform-box:view-box; transform-origin:100px 80px;}
  .live .a-brows{animation:brows 6.5s ease-in-out infinite;}
  .live .a-blush{animation:blush 4s ease-in-out infinite;}
  .live .a-tw{animation:twinkle 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
  .live .a-fl{animation:float 4s ease-in-out infinite;}
  .live .a-pom{animation:pom 2.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center bottom;}
  .live .a-bow{animation:wiggle 3.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
  .live .a-beat{animation:beat 1.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
  .live .a-note{animation:note 2.8s ease-out infinite;}
  .live .a-str{animation:wiggle 3s ease-in-out infinite; transform-box:fill-box; transform-origin:center top;}
  .live .a-cur{animation:cursor 1s steps(1) infinite;}
  .live .a-flash{animation:flash 3s ease-in-out infinite;}
  .live .a-tail{animation:wiggle 1.4s ease-in-out infinite; transform-box:fill-box; transform-origin:left bottom;}
  .live .a-bob{animation:bob 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center bottom;}
  .live .a-nib{animation:nib 1.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center bottom;}
  .live .a-hover{animation:float 2.6s ease-in-out infinite;}
  .live .a-rise{animation:rise 4.2s ease-in-out infinite;}
  .live .a-fall{animation:fall 3.5s linear infinite;}
  .live .a-balloon{animation:balloon 4.5s ease-in-out infinite; transform-box:view-box;}
  .live .a-swing{animation:swing 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center top;}
  @keyframes sway{0%,100%{transform:rotate(-1.2deg);} 50%{transform:rotate(1.2deg);}}
  @keyframes twitch{0%,84%,100%{transform:rotate(0);} 88%{transform:rotate(-3deg);} 92%{transform:rotate(2.5deg);} 96%{transform:rotate(-1deg);}}
  @keyframes brows{0%,70%,82%,100%{transform:translateY(0);} 74%,78%{transform:translateY(-2.5px);}}
  @keyframes blush{0%,100%{opacity:.35;} 50%{opacity:.6;}}
  @keyframes twinkle{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.3); opacity:.55;}}
  @keyframes float{0%,100%{transform:translateY(-3px);} 50%{transform:translateY(3px);}}
  @keyframes pom{0%,100%{transform:scale(1,1);} 40%{transform:scale(1.08,.92);} 60%{transform:scale(.96,1.06);}}
  @keyframes wiggle{0%,100%{transform:rotate(-5deg);} 50%{transform:rotate(5deg);}}
  @keyframes beat{0%,40%,100%{transform:scale(1);} 15%{transform:scale(1.15);} 28%{transform:scale(1.05);}}
  @keyframes note{0%{opacity:0; transform:translateY(6px);} 25%{opacity:1;} 100%{opacity:0; transform:translateY(-18px);}}
  @keyframes cursor{0%{opacity:1;} 50%{opacity:0;}}
  @keyframes bob{0%,100%{transform:rotate(-6deg);} 50%{transform:rotate(5deg);}}
  @keyframes nib{0%,100%{transform:scale(1,1);} 50%{transform:scale(1.04,.97);}}
  @keyframes rise{0%{transform:translateY(8px); opacity:0;} 25%{opacity:1;} 100%{transform:translateY(-22px); opacity:0;}}
  @keyframes fall{0%{transform:translateY(-12px); opacity:0;} 20%,70%{opacity:1;} 100%{transform:translateY(14px); opacity:0;}}
  @keyframes balloon{0%,100%{transform:rotate(-3deg) translateY(0);} 50%{transform:rotate(3deg) translateY(-3px);}}
  @keyframes swing{0%,100%{transform:rotate(-7deg);} 50%{transform:rotate(7deg);}}
  @keyframes flash{0%,80%,100%{opacity:1;} 85%,95%{opacity:.35;} 90%{opacity:1;}}
  @media (prefers-reduced-motion:reduce){ .live *{animation:none !important;} }

  .actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%;}
  .btn{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; border:1.5px solid var(--teal); background:var(--surface); color:var(--teal-dark); border-radius:999px; padding:8px 14px; cursor:pointer; white-space:nowrap; transition:background .15s ease, transform .1s ease;}
  .btn:hover{background:var(--teal-soft);}
  .btn svg.ic{width:20px; height:20px; vertical-align:-5px; margin-right:5px;}
  .btn:active{transform:scale(.97);}
  .btn.main{background:var(--teal); color:#fff; grid-column:1 / -1; font-size:17px; padding:10px 14px;}
  .btn.main:hover{background:var(--teal-dark);}

  /* ---------- Panel ---------- */
  .panel{min-width:0;}
  .tabs{display:grid; grid-template-columns:repeat(6,1fr); gap:4px; background:var(--surface); border:1.5px solid var(--line); border-radius:22px; padding:6px; box-shadow:0 6px 18px rgba(27,27,58,.05);}
  .tab{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-width:0; border:none; background:transparent; color:var(--ink-soft); padding:10px 4px 7px; border-radius:16px; cursor:pointer;
       font-family:'Baloo 2',sans-serif; font-weight:600; font-size:13px; line-height:1.15; text-align:center; transition:background .2s ease, color .2s ease, box-shadow .2s ease;}
  .tab svg{flex-shrink:0; width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:transform .25s cubic-bezier(.3,1.6,.5,1);}
  .tab .dot{fill:currentColor; stroke:none;}
  .tab:hover{background:var(--teal-soft); color:var(--teal-dark);}
  .tab:hover svg{transform:translateY(-2px) rotate(-6deg);}
  .tab.on{background:linear-gradient(140deg,#16A3A0 0%,#2BC4BF 100%); color:#fff; box-shadow:0 6px 14px rgba(22,163,160,.35);}
  .tab.on svg{transform:scale(1.1);}

  .group{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-l); padding:16px 18px 18px; margin-top:12px;}
  .group h3{font-size:16px; margin-bottom:10px;}
  .opts{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px;}
  .opt{display:flex; flex-direction:column; align-items:center; gap:4px; border:2px solid var(--line); background:var(--surface); border-radius:var(--radius-m); padding:6px 6px 4px; cursor:pointer; transition:border-color .15s ease, transform .1s ease;}
  .opt svg{width:100%; aspect-ratio:1; display:block; padding:6px; background:var(--bg); border-radius:calc(var(--radius-m) - 6px);}
  .opt span{font-family:'Baloo 2',sans-serif; font-weight:600; font-size:13px; line-height:1.2; color:var(--ink-soft); text-align:center;}
  .opt:hover{border-color:var(--teal);}
  .opt:active{transform:scale(.96);}
  .opt.on{border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft);}
  .opt.on span{color:var(--teal-dark);}
  .swatches{display:flex; flex-wrap:wrap; gap:10px;}
  .sw{width:42px; height:42px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1.5px var(--line); cursor:pointer; transition:transform .1s ease, box-shadow .15s ease;}
  .sw:hover{transform:scale(1.08);}
  .sw.on{box-shadow:0 0 0 3px var(--teal);}
  /* Група, яка зараз не впливає на аватар (колір очей без райдужки): лишається на місці, щоб список не стрибав */
  .group h3 .off-hint{display:none; font-family:'Nunito Sans',sans-serif; font-weight:600; font-size:13px; color:var(--ink-soft);}
  .group.off h3 .off-hint{display:inline;}
  .group.off .swatches{opacity:.35; pointer-events:none;}
  .opt:focus-visible, .sw:focus-visible, .tab:focus-visible, .btn:focus-visible{outline:3px solid var(--purple); outline-offset:2px;}

  .toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--ink); color:#fff; font-family:'Baloo 2',sans-serif; font-weight:600; padding:8px 18px; border-radius:999px; opacity:0; transition:all .25s ease; pointer-events:none; z-index:20;}
  .toast.show{opacity:1; transform:translate(-50%,0);}

  footer{padding:0 16px 48px; text-align:center; color:var(--ink-soft); font-size:13.5px;}

  @media (max-width:760px){
    .maker{grid-template-columns:minmax(0,1fr); gap:14px; padding-top:0;}
    .tabs{display:flex; overflow-x:auto; scrollbar-width:none;}
    .tab{flex:0 0 76px;}
    /* Аватар лишається видним, поки гортаєш варіанти */
    .stage{top:49px; z-index:5; flex-direction:row; flex-wrap:wrap; justify-content:center; padding:12px; gap:10px 14px; border-radius:0 0 var(--radius-l) var(--radius-l); margin:0 -16px; border-top:none; box-shadow:0 6px 14px rgba(27,27,58,.06);}
    .stage h1{display:none;}
    .avatar-wrap{width:130px;}
    /* Малий аватар стоїть біля лівого краю — фраза росте праворуч, над кнопками, і переноситься */
    .bubble{right:auto; left:4px; top:-10px; z-index:2; font-size:13px; line-height:1.3; white-space:normal; width:max-content; max-width:min(230px, calc(100vw - 40px));}
    .btn .ic{display:none;}
    .actions{width:auto; flex:1; min-width:0; max-width:260px;}
    .btn{font-size:13.5px; padding:6px 6px;}
    .btn.main{font-size:15px; padding:7px 10px;}
    .opts{grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:8px;}
    .group{padding:14px;}
  }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-inner">
  <a class="back-link" href="../index.html">← Лабораторія</a>
  <span class="game-title">Конструктор аватарів</span>
</div></div>

<main class="maker">
  <section class="stage">
    <h1>Створи свій аватар</h1>
    <div class="avatar-wrap" id="avatar" title="Клацни мене!" role="img" aria-label="Твій аватар">
      <div class="bubble" id="bubble"></div>
      <div class="tap-hint" id="tapHint" aria-hidden="true"><span class="ripple"></span><svg viewBox="0 0 24 24"><path d="M9 11 V4.2 a1.7 1.7 0 0 1 3.4 0 V10 a1.6 1.6 0 0 1 3.2 .3 a1.6 1.6 0 0 1 3.1 .6 a1.5 1.5 0 0 1 2.9 .8 V16 c0 3.6 -2.6 6 -6 6 h-1.6 c-2 0 -3.4 -.8 -4.6 -2.4 L5.2 15.6 a1.6 1.6 0 0 1 2.5 -2 L9 15 Z" fill="#fff" stroke="#1B1B3A" stroke-width="1.3" stroke-linejoin="round"/><path d="M12.4 10 V13.2 M15.6 10.3 V13.4 M18.7 11 V13.6" fill="none" stroke="#1B1B3A" stroke-width="1.1" stroke-linecap="round"/></svg></div>
    </div>
    <div class="actions">
      <button class="btn main" id="randomBtn">Випадковий</button>
      <button class="btn" id="saveBtn"><span class="ic">⬇ </span>Зберегти</button>
      <button class="btn" id="shareBtn" title="Скопіювати посилання на аватар"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 7.5H7a4.5 4.5 0 0 0 0 9h3"/><path d="M14 7.5h3a4.5 4.5 0 0 1 0 9h-3"/><path d="M8.5 12h7"/></svg>Посилання</button>
    </div>
  </section>

  <section class="panel">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="groups"></div>
  </section>
</main>

<footer>Лабораторія · Конструктор аватарів</footer>
<div class="toast" id="toast"></div>

<script>
/* ================= Палітри ================= */
const SKIN  = ['#FFE7D1','#FFDFC4','#F7C9A0','#E3A979','#C68642','#A86B3C','#8D5524','#5C3A21'];
const HAIR  = ['#2B1B10','#5A3825','#8B5A2B','#D9A441','#F5D98B','#B7472A','#A0A3AD','#FF7BB0','#5B8DEF','#8E6CE8'];
const CLOTH = ['#6C5CE7','#16A3A0','#FF6B4A','#FFC93C','#FF5D9E','#2D9CDB','#2ECC71','#1B1B3A','#F1EFFA','#C0392B'];
const BG    = ['#E3F7F6','#EDE9FF','#FFE9F2','#FFF4D6','#E3F0FF','#E6F8E6','#FFE4DC','#1B1B3A','#6C5CE7','#16A3A0'];
const INK = '#1B1B3A';
const EYEC  = ['#5A3A22','#2B1B10','#9A7130','#3E8E5E','#3B82C4','#7D8A99','#7B5CC9'];
/* Очі, де видно райдужку — для них можна обрати колір */
const EYE_COLOR = [1,8,9,10];

/* Половина ширини голови для кожної форми — під неї підлаштовуються вуха й зачіски */
const HW = [46, 40, 45, 45, 50];
/* Верх кожної форми голови. Зачіски, вушка й шапки намальовано для круглої голови (верх 48)
   і підганяються під іншу форму масштабом відносно лінії очей (y=98). */
const TOP = [48, 46, 50, 48, 53];
function fitT(s){
  const kx = HW[s.head]/46, ky = (98-TOP[s.head])/50;
  return `transform="translate(100 98) scale(${kx.toFixed(3)} ${ky.toFixed(3)}) translate(-100 -98)"`;
}
/* Волосся «по шкірі» (стрижка під машинку, ірокез) — точно по контуру голови будь-якої форми */
function onScalp(s, h, opacity){
  const u = ++UID;
  return `<clipPath id="sc${u}">${headShape(s.head,'')}</clipPath><rect x="0" y="0" width="200" height="74" fill="${h}" opacity="${opacity}" clip-path="url(#sc${u})"/>`;
}

/* ================= Стан ================= */
// Порядок ключів важливий: з нього будується код аватара в посиланні (#a=…)
const KEYS = ['shape','bgc','pat','skin','head','cheeks','ears','eyes','brows','mouth','hair','hairc','cloth','clothc','glasses','hat','earr','neck','pet','fx','hear','eyec'];
const NAMES = {
  shape:  ['Квадрат','Коло'],
  pat:    ['Без візерунка','Горошок','Смужки','Зірочки','Клітинка','Конфеті'],
  head:   ['Кругла','Овальна','Квадратна','Сердечком','Широка'],
  cheeks: ['Без нічого','Рум\'янець','Веснянки','Усе разом'],
  ears:   ['Без вушок','Котячі','Ведмежі','Заячі','Антенки робота'],  // доповнення (обруч); людські вуха — hear
  hear:   ['Звичайні','Маленькі','Великі','Круглі','Відстовбурчені'],
  eyes:   ['Крапки','Великі','Радісні','Сонні','Підморгування','Зірочки','Закоханість','Здивовані','З віями','Блискучі','Хитрі'],
  brows:  ['Без брів','Звичайні','Здивовані','Сердиті','Сумні','Густі'],
  mouth:  ['Усмішка','Регіт','Ой!','Спокій','Язичок','Хитрість','Котик','Сум'],
  hair:   ['Без волосся','Коротка','Їжачок','Кучері','Довге','Каре','Хвостики','Гулька',null,'Афро','Під машинку','На проділ','Чубчик','Коса','Хвіст','Хвилясте','Пряме','Пряме з чубчиком','Дві коси','Довгі кучері','Під горщик','Скуйовджене'],
  cloth:  ['Футболка','Худі','Светр','Сорочка','Програміст','Супергерой','Поло','Піджак','Комбінезон','Сукня','Блуза','Олімпійка','Я можу!','Знання — сила','Не здавайся','Мрій сміливо','Все вийде!','Київ','Гімназія №131','Футбольна'],
  earr:   ['Без сережок','Кульки','Кільця','Сердечка','Зірочки','Перлинки'],
  pet:    ['Без улюбленця','Котик','Песик','Папуга','Хом\'ячок','Робот-помічник','Сова','Зайчик','Пінгвін','Лисичка','Черепашка'],
  fx:     ['Без ефектів','Іскорки','Сердечка','Повітряні кульки',null,'Бульбашки','Двійковий код','Квіточки'],  // 4 — прибране сяйво
  neck:   ['Без намиста','Перли','Сердечко','Бусини',null,'Чокер'],  // 4 — прибрана зірка
  glasses:['Без окулярів','Круглі','Квадратні','Сонцезахисні','Сердечка','Пікселі'],

function encode(s){ return KEYS.map(k=>s[k].toString(36)).join(''); }
function decode(code){
  if(!code || code.length<16 || code.length>KEYS.length) return null;
  const s = {...DEFAULT};
  for(let i=0;i<code.length;i++){
    const v = parseInt(code[i],36);
    if(isNaN(v)) return null;
    s[KEYS[i]] = (v>=COUNT[KEYS[i]] || isGone(KEYS[i], v)) ? DEFAULT[KEYS[i]] : v;

function shade(hex, p){
  const n = parseInt(hex.slice(1),16);
  const f = v => Math.max(0, Math.min(255, Math.round(p<0 ? v*(1+p) : v+(255-v)*p)));
  return '#' + ((1<<24) | (f(n>>16)<<16) | (f(n>>8&255)<<8) | f(n&255)).toString(16).slice(1);
}

    d += (i?'L':'M') + (cx+rr*Math.cos(a)).toFixed(1) + ' ' + (cy+rr*Math.sin(a)).toFixed(1);

function drawEarrings(s, hw){
  const x = 100 - hw, gold = '#FFC93C', gd = '#D9A11A';
  const sw = (inner, d=0) => `<g class="a-swing" style="animation-delay:${d}s">${inner}</g>`;
  let o = '';
  switch(s.earr){
    case 1: o = `<circle cx="${x}" cy="113" r="3.3" fill="${gold}" stroke="${gd}" stroke-width="1"/>`; break;
    case 2: o = sw(`<circle cx="${x}" cy="118" r="6.5" fill="none" stroke="${gold}" stroke-width="2.4"/>`); break;
    case 3: o = sw(`<path d="M${x} 110 V113" stroke="${gold}" stroke-width="1.4"/><path d="${HEART}" transform="translate(${x} 117) scale(.55)" fill="#FF5D9E"/>`); break;
    case 4: o = sw(`<path d="M${x} 110 V113" stroke="${gold}" stroke-width="1.4"/>` + star(x, 118, 5.5, gold, `stroke="${gd}" stroke-width=".8"`)); break;
    case 5: o = sw(`<circle cx="${x}" cy="112" r="1.8" fill="${gold}"/><path d="M${x} 113 V116" stroke="${gold}" stroke-width="1.3"/><circle cx="${x}" cy="119.5" r="3.8" fill="#fff" stroke="#D9D3EE" stroke-width="1"/><circle cx="${x-1.2}" cy="118.3" r="1" fill="#fff"/>`); break;
  }
  if(!o) return '';
  const [lx, ly] = earLobe(s, hw);
  return both(`<g transform="translate(${(lx-x).toFixed(1)} ${(ly-111).toFixed(1)})">${o}</g>`);
}

function drawNecklace(s){
  const gold = '#FFC93C', gd = '#D9A11A';
  const pt = t => [(1-t)*(1-t)*86 + 2*t*(1-t)*100 + t*t*114, (1-t)*(1-t)*148 + 2*t*(1-t)*170 + t*t*148];
  const beads = (n, f) => { let o=''; for(let i=0;i<=n;i++){ const [x,y]=pt(i/n); o += f(x.toFixed(1), y.toFixed(1), i); } return o; };
  const chain = `<path d="M86 148 Q100 170 114 148" fill="none" stroke="${gold}" stroke-width="1.3"/>`;
  switch(s.neck){
    case 1: return beads(10, (x,y)=>`<circle cx="${x}" cy="${y}" r="2.4" fill="#fff" stroke="#D9D3EE" stroke-width=".8"/>`);
    case 2: return chain + `<g class="a-swing"><path d="M100 159 V161" stroke="${gold}" stroke-width="1.3"/><path d="${HEART}" transform="translate(100 165) scale(.6)" fill="#FF5D9E"/></g>`;
    case 3: { const cols = ['#FF5D9E','#FFC93C','#2D9CDB','#2ECC71','#6C5CE7','#FF6B4A'];
      return beads(9, (x,y,i)=>`<circle cx="${x}" cy="${y}" r="2.8" fill="${cols[i%cols.length]}"/>`); }

  }
  return '';
}

    `<ellipse cx="100" cy="96" rx="46" ry="48" ${attrs}/>`,

    `<path d="M54 86 C54 60 74 48 100 48 C126 48 146 60 146 86 C146 114 124 136 100 144 C76 136 54 114 54 86 Z" ${attrs}/>`,
    `<ellipse cx="100" cy="98" rx="50" ry="45" ${attrs}/>`,

}

/* Мініатюра варіанта: лише сам елемент (окуляри, зачіска…), без решти аватара.
   Пунктирний контур голови підказує, де елемент опиниться. */
const NONE_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="22" fill="none" stroke="#C9C5DE" stroke-width="5"/><path d="M35 65 L65 35" stroke="#C9C5DE" stroke-width="5" stroke-linecap="round"/></svg>`;
const OPTIONAL = ['cheeks','brows','glasses','hat','hair','earr','neck','pet','fx','ears'];
function partSVG(key, v){
  if(v===0 && OPTIONAL.includes(key)) return NONE_SVG;
  const s = {...state, [key]:v}, hw = HW[s.head], skin = SKIN[s.skin];
  const ghost = headShape(s.head, 'fill="none" stroke="#CFCBE3" stroke-width="2.5" stroke-dasharray="5 4"');
  // Для кумедних вушок контур залитий кольором тла кнопки: він ховає основи вушок, як голова в аватарі
  const ghostFill = headShape(s.head, 'fill="#F6F5FB" stroke="#CFCBE3" stroke-width="2.5" stroke-dasharray="5 4"');
  const ex = eyeX(hw);
  let vb, o;
  switch(key){
    case 'head':   vb = '44 42 112 108'; o = drawSideEars(s, hw) + headShape(v, `fill="${skin}"`); break;
    case 'cheeks': vb = '62 99 76 26'; o = headShape(s.head, `fill="${skin}"`) + drawCheeks(s, hw); break;
    case 'eyes':   vb = '66 82 68 32'; o = drawEye(v, ex, 98, -1, s, '#F6F5FB') + drawEye(v, 200-ex, 98, 1, s, '#F6F5FB'); break;
    case 'brows':  vb = '66 66 68 30'; o = drawBrows(s); break;
    case 'mouth':  vb = '76 102 48 36'; o = drawMouth(v); break;
    case 'hair':   vb = '30 8 140 170'; { const [b,f] = drawHair(s); o = (b||'') + ghost + (f||''); } break;
    case 'ears':   vb = '22 -6 156 130'; o = drawAnimalEars(s) + ghostFill; break;
    case 'hear':   vb = `${100-hw-21} 82 36 36`; o = drawSideEars(s, hw); break;  // крупно — одне вухо
    case 'cloth':  vb = v>=12 && v<19 ? '48 150 104 52' : '26 124 148 78'; o = neckRect(s) + drawBody(s, ++UID); break;
    case 'glasses':vb = '48 80 104 36'; o = drawGlasses(s, hw); break;
    case 'pet':    vb = {3:'122 106 56 80', 5:'140 108 64 72', 7:'134 114 68 88', 9:'118 128 84 74', 10:'122 128 84 74'}[s.pet] || '136 128 68 72'; o = drawPet(s); break;
    case 'fx':     vb = '0 0 200 200'; o = `<rect width="200" height="200" fill="${BG[s.bgc]}"/>` + drawFx(s) + headShape(s.head, 'fill="none" stroke="#CFCBE3" stroke-width="3" stroke-dasharray="6 5"'); break;
    case 'earr':   vb = `${100-hw-18} 88 36 42`; o = drawSideEars(s, hw) + drawEarrings(s, hw); break;  // крупно — одна сережка
    case 'neck':   vb = '68 122 64 56'; o = `<rect x="88" y="120" width="24" height="36" fill="${shade(skin,-.12)}"/><path d="${TORSO}" fill="#E4E1F5"/><path d="M86 150 Q100 166 114 150 Z" fill="${shade(skin,-.12)}"/>` + drawNecklace(s); break;
    case 'hat':    vb = '32 -4 136 118'; o = ghost + drawHat(s, hw); break;
    case 'pat':    vb = '0 0 200 200'; o = `<rect width="200" height="200" fill="${BG[s.bgc]}"/>` + drawPattern(s); break;
    case 'shape':  vb = '-10 -10 220 220'; o = v ? `<circle cx="100" cy="100" r="100" fill="${BG[s.bgc]}"/>` : `<rect width="200" height="200" rx="24" fill="${BG[s.bgc]}"/>`; break;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" aria-hidden="true">${o}</svg>`;
}

/* Повний аватар як рядок SVG */
function avatarSVG(s, {cls='', size=''}={}){
  const u = ++UID, hw = HW[s.head], skin = SKIN[s.skin];
  const [hairBack, hairFront] = drawHair(s);
  const head = headShape(s.head, `fill="${skin}"`);
  const ex = eyeX(hw);
  const body = [
    `<rect width="200" height="200" fill="${BG[s.bgc]}"/>`,
    drawPattern(s),
    drawFx(s),
    neckRect(s),
    drawBody(s, u),
    drawNecklace(s),
    hairBack && `<g class="a-sway">${hairBack}</g>`,
    s.ears ? `<g class="a-ears">${drawAnimalEars(s)}</g>` : '',
    drawSideEars(s, hw),
    head,
    drawEarrings(s, hw),
    drawCheeks(s, hw),
    drawEye(s.eyes, ex, 98, -1, s), drawEye(s.eyes, 200-ex, 98, 1, s),
    `<g class="a-brows">${drawBrows(s)}</g>`,
    drawMouth(s.mouth),
    hairFront,
    drawGlasses(s, hw),
    drawHat(s, hw),
    drawPet(s),
  ].join('');
  const content = s.shape===1 ? `<clipPath id="r${u}"><circle cx="100" cy="100" r="100"/></clipPath><g clip-path="url(#r${u})">${body}</g>` : body;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" ${size} preserveAspectRatio="xMidYMid slice" class="${cls}" aria-hidden="true">${content}</svg>`;
}

  {icon:'<circle cx="6.5" cy="13" r="3.8"/><circle cx="17.5" cy="13" r="3.8"/><path d="M10.3 12.4 Q12 11 13.7 12.4 M2.7 12.5 L1.5 8.5 M21.3 12.5 L22.5 8.5"/>', name:'Аксесуари', groups:[{key:'glasses', title:'Окуляри'}, {key:'hat', title:'На голову'}, {key:'ears', title:'Кумедні вушка'}, {key:'earr', title:'Сережки'}, {key:'neck', title:'Намисто'}]},

  {icon:'<path d="M11 4 L12.6 10.4 L19 12 L12.6 13.6 L11 20 L9.4 13.6 L3 12 L9.4 10.4 Z"/><path d="M19 3 V7 M17 5 H21"/>', name:'Ефекти', groups:[{key:'fx', title:'Ефекти', items:[0,1,7,2,3,5,6]}]},

];

let state = loadState();
let tab = 0;
const $ = id => document.getElementById(id);
const avatarEl = $('avatar');

function loadState(){
  const fromHash = decode((location.hash.match(/a=([0-9a-z]+)/)||[])[1]);
  if(fromHash) return fromHash;
  try{ const s = decode(localStorage.getItem(STORE)); if(s) return s; }catch(e){}
  return {...DEFAULT};
}
function saveState(){ try{ localStorage.setItem(STORE, encode(state)); }catch(e){} }

let override = null;
function renderAvatar(){
  const s = override ? {...state, ...override} : state;
  avatarEl.querySelector(':scope > svg')?.remove();
  avatarEl.insertAdjacentHTML('afterbegin', avatarSVG(s, {cls:'live'}));
  avatarEl.classList.toggle('round', s.shape===1);
}

function renderTabs(){
  $('tabs').innerHTML = TABS.map((t,i)=>`<button class="tab${i===tab?' on':''}" role="tab" aria-selected="${i===tab}" data-i="${i}"><svg viewBox="0 0 24 24" aria-hidden="true">${t.icon}</svg><span>${t.name}</span></button>`).join('');
}

function renderGroups(){
  $('groups').innerHTML = TABS[tab].groups.map(g=>{
    const off = g.when && !g.when(state);
    let inner;
    if(g.colors){
      inner = `<div class="swatches">${g.colors.map((c,i)=>`<button class="sw${state[g.key]===i?' on':''}" style="background:${c}" data-k="${g.key}" data-v="${i}" aria-label="Колір ${i+1}"${off?' disabled':''}></button>`).join('')}</div>`;
    }else{
      const items = g.items || NAMES[g.key].map((_,i)=>i).filter(i=>!isGone(g.key, i));
      inner = `<div class="opts">${items.map(i=>{ const n = NAMES[g.key][i];
        return `<button class="opt${state[g.key]===i?' on':''}" data-k="${g.key}" data-v="${i}" title="${n}">${partSVG(g.key, i)}<span>${n}</span></button>`; }).join('')}</div>`;
    }
    return `<div class="group${off?' off':''}"><h3>${g.title}${g.off?` <span class="off-hint">${g.off}</span>`:''}</h3>${inner}</div>`;
  }).join('');
}

function setState(next){
  if(encode(next)===encode(state)) return;
  state = next;
  saveState(); renderAvatar(); renderGroups();
  // Після змін посилання з #a=… вже не відповідає аватару — прибираємо його
  if(location.hash) try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
}

$('tabs').addEventListener('click', e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  tab = +b.dataset.i; renderTabs(); renderGroups();
});
$('groups').addEventListener('click', e=>{
  const b = e.target.closest('[data-k]'); if(!b) return;
  setState({...state, [b.dataset.k]: +b.dataset.v});
});

/* Випадковий аватар: рідкісні речі (шапки, вушка тварин, фантастична шкіра) — не щоразу */
const rnd = n => Math.floor(Math.random()*n);
// any — будь-який наявний варіант, крім «без нічого» (0); maybe — він же з імовірністю p
const any = k => { const vs = [...Array(COUNT[k]).keys()].filter(v=>v && !isGone(k, v)); return vs[rnd(vs.length)]; };
const maybe = (p, k) => Math.random()<p ? any(k) : 0;
$('randomBtn').addEventListener('click', ()=>{
  const s = {};
  KEYS.forEach(k=>s[k]=rnd(COUNT[k]));
  s.hat = maybe(0.35, 'hat');
  s.glasses = maybe(0.35, 'glasses');
  s.earr = maybe(0.3, 'earr');
  s.neck = maybe(0.25, 'neck');
  s.pet = maybe(0.3, 'pet');
  s.fx = maybe(0.3, 'fx');
  s.ears = maybe(0.3, 'ears');
  s.hair = Math.random()<0.06 ? 0 : any('hair');
  s.shape = state.shape;
  setState(s);
  bounce();
});

/* ---------- Реакція на клацання ---------- */
const PHRASES = ['Привіт!','Хі-хі, лоскотно!','Чудовий вибір!','Мені подобається!','Який стильний образ!','У тебе чудовий смак!',
  'Ти класно це придумуєш!','Давай дружити!','Сьогодні гарний день!','Ти молодець!','Гарного тобі уроку!','Вчитися — це цікаво!',
  'Разом веселіше!','Дай п\'ять!','Як гарно вийшло!','Мені пасує!','Посміхнись!','Ура, це я!','Кожна деталь — супер!',
  'Ще трохи — і ідеально!','Мені весело з тобою!','Ти робиш цей день кращим!','Обіймаю!','Ти все зможеш!'];
let lastPhrase = -1;
let reactT;
function bounce(){
  avatarEl.classList.remove('bounce'); void avatarEl.offsetWidth; avatarEl.classList.add('bounce');
}
avatarEl.addEventListener('click', ()=>{
  const hint = $('tapHint');
  if(hint){ hint.classList.add('gone'); setTimeout(()=>hint.remove(), 350); }
  clearTimeout(reactT);
  override = {eyes:2, mouth:1};
  renderAvatar(); bounce();
  const b = $('bubble');
  let k; do{ k = rnd(PHRASES.length); }while(k===lastPhrase);
  lastPhrase = k;
  b.textContent = PHRASES[k];
  b.classList.add('show');
  reactT = setTimeout(()=>{ override = null; renderAvatar(); b.classList.remove('show'); }, 1300);
});

/* ---------- Погляд за курсором ---------- */
window.addEventListener('pointermove', e=>{
  const r = avatarEl.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width*0.5), dy = e.clientY - (r.top + r.height*0.49);
  const len = Math.hypot(dx, dy) || 1, k = Math.min(1, len/180);
  avatarEl.style.setProperty('--px', (dx/len*k*2.6).toFixed(2));
  avatarEl.style.setProperty('--py', (dy/len*k*2.2).toFixed(2));
});

/* ---------- Збереження картинки ---------- */
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove('show'), 2200);
}
/* Картинка з SVG не бачить шрифтів сторінки, тож написи (футболки, кепки) вийшли б звичайним Arial.
   Тому вбудовуємо в SVG сам шрифт Baloo 2 — лише літери, що є в написах. Без інтернету — збережемо без нього. */
async function fontCSS(svg){
  const chars = [...new Set((svg.match(/<text[^>]*>[^<]*/g)||[]).map(t=>t.replace(/<text[^>]*>/,'')).join(''))].join('');
  if(!chars) return '';
  try{
    const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 4000);
    const css = await (await fetch('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&text=' + encodeURIComponent(chars), {signal:ctl.signal})).text();
    const url = (css.match(/url\((https:[^)]+)\)/)||[])[1];
    if(!url) return '';
    const blob = await (await fetch(url, {signal:ctl.signal})).blob();
    const data = await new Promise((ok, fail)=>{ const r = new FileReader(); r.onload = ()=>ok(r.result); r.onerror = fail; r.readAsDataURL(blob); });
    return `<style>@font-face{font-family:'Baloo 2';font-weight:800;src:url(${data}) format('woff2');}</style>`;
  }catch(e){ return ''; }
}
$('saveBtn').addEventListener('click', async ()=>{
  let svg = avatarSVG(state, {size:'width="600" height="600"'});
  const font = await fontCSS(svg);
  if(font) svg = svg.replace(/(<svg[^>]*>)/, '$1' + font);
  const img = new Image();
  img.onload = ()=>{
    const cv = document.createElement('canvas'); cv.width = cv.height = 600;
    cv.getContext('2d').drawImage(img, 0, 0, 600, 600);
    try{
      cv.toBlob(blob=>download(URL.createObjectURL(blob), 'avatar.png'), 'image/png');
    }catch(e){ download(img.src, 'avatar.svg'); }
  };
  img.onerror = ()=>download(img.src, 'avatar.svg');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
});
function download(href, name){
  const a = document.createElement('a'); a.href = href; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  if(href.startsWith('blob:')) setTimeout(()=>URL.revokeObjectURL(href), 1000);
  toast('Аватар збережено 🖼️');
}

/* ---------- Посилання ---------- */
$('shareBtn').addEventListener('click', async ()=>{
  const url = location.href.split('#')[0] + '#a=' + encode(state);
  try{ await navigator.clipboard.writeText(url); toast('Посилання скопійовано 🔗'); }
  catch(e){ window.prompt('Скопіюй посилання на свій аватар:', url); }
});

renderTabs(); renderGroups(); renderAvatar();
</script>
