<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Знайди пару: English Alphabet · Лабораторія</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5FB; --ink:#1B1B3A; --ink-soft:#514F72; --surface:#FFFFFF; --line:#E4E1F5;
    --purple:#6C5CE7; --purple-dark:#5340c9; --teal:#16A3A0; --teal-dark:#0E7C7A; --coral:#FF6B4A;
    --yellow:#FFC93C; --pink:#FF5D9E; --blue:#2D9CDB;
    --radius-s:10px; --radius-m:16px; --radius-l:26px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Nunito Sans',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Baloo 2',sans-serif; font-weight:700; margin:0; color:var(--ink);}
  button{font:inherit;}
  .container{max-width:1100px; margin:0 auto; padding:0 16px;}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky; top:0; z-index:10; background:rgba(246,245,251,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1100px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px;}
  .back-link{font-family:'Baloo 2',sans-serif; font-weight:600; font-size:14px; color:var(--teal-dark); text-decoration:none; white-space:nowrap;}
  .back-link:hover{text-decoration:underline;}
  .game-title{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .restart-btn, .sound-btn{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; border:1.5px solid var(--teal); background:var(--surface); color:var(--teal-dark); border-radius:999px; padding:4px 14px; cursor:pointer; white-space:nowrap;}
  .restart-btn:hover, .sound-btn:hover{background:#E3F7F6;}
  .sound-btn{margin-left:auto;}
  .sound-btn[aria-pressed="false"]{border-color:var(--line); color:var(--ink-soft);}
  .restart-btn .short, .sound-btn .short{display:none;}
  @media (max-width:560px){ .game-title{display:none;} .restart-btn .long, .sound-btn .long{display:none;} .restart-btn .short, .sound-btn .short{display:inline;} .restart-btn, .sound-btn{padding:4px 11px;} .topbar-inner{gap:8px;} }

  /* ---------- Board ---------- */
  .game{display:flex; align-items:center; justify-content:center; gap:18px; min-height:calc(100dvh - 60px); padding:12px 16px;}
  .board{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; width:min(calc(100vw - 220px), calc((100dvh - 100px) * 1.8), 980px);}

  /* Колонки пар ліворуч і праворуч: сірі, поки пару не знайдено */
  .pairs-col{display:flex; flex-direction:column; gap:10px;}
  .pair-chip{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:22px; line-height:1; width:68px; padding:10px 0 8px; text-align:center; border-radius:var(--radius-s); background:#ECEBF3; color:#B0AEC4; border:2px solid transparent; transition:all .3s ease;}
  .pair-chip.found{background:var(--chip-light); color:var(--chip-c); border-color:var(--chip-c); animation:chip-pop .4s ease;}
  @keyframes chip-pop{50%{transform:scale(1.15);}}

  @media (max-width:600px){
    .game{flex-direction:column; justify-content:center; gap:12px; padding:12px;}
    .board{grid-template-columns:repeat(4,1fr); gap:8px; width:min(100%, calc((100dvh - 200px) * 0.8));}
    .pairs-col{flex-direction:row; flex-wrap:wrap; justify-content:center; gap:6px;}
    .pair-chip{font-size:16px; width:46px; padding:6px 0 5px;}
  }

  .card{position:relative; aspect-ratio:5/4; perspective:800px; border:none; padding:0; background:none; cursor:pointer; container-type:inline-size;}
  .card:disabled{cursor:default;}
  .flip-inner{position:absolute; inset:0; transition:transform .45s ease; transform-style:preserve-3d;}
  .flip-inner.flipped{transform:rotateY(180deg);}
  .flip-front, .flip-back{position:absolute; inset:0; border-radius:var(--radius-m); backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .flip-front{background:linear-gradient(135deg,var(--teal) 0%,#1FBFBB 100%); border:2px solid var(--teal-dark); box-shadow:0 3px 0 rgba(14,124,122,.35);}
  .flip-front::before{content:""; position:absolute; inset:7px; border:2px dashed rgba(255,255,255,.45); border-radius:calc(var(--radius-m) - 5px);}
  .flip-front span{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:24cqw; color:rgba(255,255,255,.9);}
  .card:hover .flip-inner:not(.flipped) .flip-front{filter:brightness(1.07);}
  .card:focus-visible{outline:3px solid var(--purple); outline-offset:3px; border-radius:var(--radius-m);}
  .flip-back{
    border:2px solid var(--card-c, var(--line));
    background:var(--card-c-light, #FFFFFF);
    transform:rotateY(180deg); /* без цього рядка — баг */
  }
  .flip-back .face{display:flex; align-items:center; justify-content:center; gap:5cqw; transition:transform .3s ease;}
  .flip-back .pic{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; font-size:30cqw; line-height:1;}
  .flip-back .pic svg{width:1em; height:1em; display:block;}
  .flip-back .letter{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:42cqw; line-height:1; color:var(--card-c, var(--ink)); text-box:trim-both cap alphabetic;}
  .card.matched .flip-back .face{transform:translateY(-12%);}
  .flip-back .name{position:absolute; left:0; right:0; bottom:4%; text-align:center; white-space:nowrap; font-family:'Baloo 2',sans-serif; font-weight:600; font-size:9.5cqw; line-height:1.2; color:var(--card-c, var(--ink-soft)); opacity:0; transition:opacity .3s ease;}
  .card.matched .flip-back .name{opacity:1;}
  .card.matched .flip-inner{animation:pop .35s ease .35s;}
  .card.wrong .flip-back{animation:shake .35s ease;}
  @keyframes pop{50%{transform:rotateY(180deg) scale(1.08);}}
  @keyframes shake{25%{translate:-4px 0;} 75%{translate:4px 0;}}

  /* ---------- Win dialog ---------- */
  .overlay{position:fixed; inset:0; z-index:20; background:rgba(27,27,58,.45); display:none; align-items:center; justify-content:center; padding:16px;}
  .overlay.show{display:flex;}
  .win{background:var(--surface); border-radius:var(--radius-l); padding:26px 24px; max-width:440px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(27,27,58,.25); max-height:90vh; overflow:auto;}
  .win h2{font-size:26px; margin-bottom:4px;}
  .win .big{font-size:56px; line-height:1; margin-bottom:6px; animation:bounce 1s ease infinite alternate;}
  @keyframes bounce{to{transform:translateY(-8px) rotate(-6deg);}}
  .confetti{position:fixed; top:-20px; width:10px; height:16px; border-radius:3px; z-index:30; pointer-events:none; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
  .stars{font-size:44px; letter-spacing:6px; line-height:1; margin:10px 0 14px;}
  .stars span{display:inline-block; animation:star-in .4s ease both;}
  .stars span:nth-child(2){animation-delay:.25s;} .stars span:nth-child(3){animation-delay:.5s;}
  .stars .dim{filter:grayscale(1); opacity:.25;}
  @keyframes star-in{from{transform:scale(0) rotate(-90deg);} to{transform:scale(1) rotate(0);}}
  .result{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
  .result div{background:var(--bg); border-radius:var(--radius-m); padding:8px 18px; min-width:110px;}
  .result b{display:block; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:26px; line-height:1.1; color:var(--teal-dark);}
  .result small{font-size:13px; color:var(--ink-soft);}
  .win-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .btn{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; border:none; border-radius:999px; padding:10px 20px; cursor:pointer;}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:var(--bg); color:var(--ink); border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--teal);}

</style>
</head>
<body>

<div class="topbar"><div class="topbar-inner">
  <a class="back-link" href="../index.html">← Лабораторія</a>
  <span class="game-title">Знайди пару: English Alphabet</span>
  <button class="sound-btn" id="soundBtn" aria-pressed="true" title="Вимова літер і слів"><span class="long">🔊 Вимова</span><span class="short">🔊</span></button>
  <button class="restart-btn" id="restartBtn" title="Почати знову"><span class="long">↻ Почати знову</span><span class="short">↻</span></button>
</div></div>

<div class="game">
  <div class="pairs-col" id="pairsLeft"></div>
  <div class="board" id="board"></div>
  <div class="pairs-col" id="pairsRight"></div>
</div>

<div class="overlay" id="overlay">
  <div class="win" role="dialog" aria-labelledby="winTitle">
    <div class="big">🏆</div>
    <h2 id="winTitle">Вітаємо!</h2>
    <div class="stars" id="wStars"></div>
    <div class="result">
      <div><b id="wMoves">0</b><small>спроб</small></div>
      <div><b id="wTime">0:00</b><small>час</small></div>
    </div>
    <div class="win-actions">
      <button class="btn btn-primary" id="againBtn">Грати ще раз</button>
    </div>
  </div>
</div>

<script>
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const PAIRS = 12;
// Назви літер українськими літерами (британська вимова: Z — «зед»)
const NAMES = {A:'ей',B:'бі',C:'сі',D:'ді',E:'і',F:'еф',G:'джі',H:'ейч',I:'ай',J:'джей',K:'кей',L:'ел',M:'ем',
  N:'ен',O:'оу',P:'пі',Q:"к'ю",R:'ар',S:'ес',T:'ті',U:'ю',V:'ві',W:'дабл-ю',X:'екс',Y:'вай',Z:'зед'};
// Як вимовляти: англійська назва літери, щоб синтезатор не казав «capital R» і не читав «a» як артикль
const SPEAK = {A:'A.',B:'bee',C:'see',D:'dee',E:'E.',F:'eff',G:'gee',H:'aitch',I:'eye',J:'jay',K:'kay',L:'ell',M:'em',
  N:'en',O:'oh',P:'pee',Q:'cue',R:'ar',S:'ess',T:'tee',U:'you',V:'vee',W:'W.',X:'ex',Y:'why',Z:'zed'};
// Малюнки: слово англійською, що починається на цю літеру. На кожну гру для літери обирається випадковий,
// і той самий малюнок показується на обох картках пари (велика й маленька літера).
const XYLOPHONE = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="40" width="52" height="5" rx="2.5" fill="#8B5A2B" transform="rotate(-8 32 42)"/><rect x="6" y="22" width="52" height="5" rx="2.5" fill="#8B5A2B" transform="rotate(8 32 24)"/><rect x="9" y="14" width="8" height="40" rx="3" fill="#FF5D9E"/><rect x="19" y="17" width="8" height="34" rx="3" fill="#FFC93C"/><rect x="29" y="20" width="8" height="28" rx="3" fill="#16A3A0"/><rect x="39" y="23" width="8" height="22" rx="3" fill="#2D9CDB"/><rect x="49" y="26" width="8" height="16" rx="3" fill="#6C5CE7"/><line x1="40" y1="60" x2="58" y2="6" stroke="#8B5A2B" stroke-width="3" stroke-linecap="round"/><circle cx="58" cy="6" r="5" fill="#FF6B4A"/></svg>`;
// Zero: повітряна кулька-цифра «0» на мотузочці (емодзі 0️⃣ виглядає як просто кнопка)
const ZERO = `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 52 Q28 57 33 60 Q37 62 34 64" fill="none" stroke="#8C88A8" stroke-width="1.6" stroke-linecap="round"/><path d="M29.5 49 L34.5 49 L32 53 Z" fill="#E0457F"/><ellipse cx="32" cy="27" rx="19" ry="23" fill="#FF5D9E"/><ellipse cx="32" cy="27" rx="8" ry="12.5" fill="#FFFFFF"/><ellipse cx="32" cy="27" rx="19" ry="23" fill="none" stroke="#E0457F" stroke-width="2"/><ellipse cx="32" cy="27" rx="8" ry="12.5" fill="none" stroke="#E0457F" stroke-width="2"/><path d="M19 17 Q21 9 28 6.5" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" opacity=".75"/><circle cx="18.4" cy="22" r="1.8" fill="#FFFFFF" opacity=".75"/></svg>`;
// Nest: гніздо з яєчками (емодзі 🪺 нове й не скрізь відображається)
const NEST = `<svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="24" cy="33" rx="7" ry="9" fill="#9ED8F5" stroke="#5FB4DF" stroke-width="1.5"/><ellipse cx="40" cy="33" rx="7" ry="9" fill="#9ED8F5" stroke="#5FB4DF" stroke-width="1.5"/><ellipse cx="32" cy="30" rx="7" ry="9" fill="#BDE6FA" stroke="#5FB4DF" stroke-width="1.5"/><circle cx="29.5" cy="27" r="1.6" fill="#FFFFFF"/><path d="M6 36 Q32 42 58 36 Q56 54 32 55 Q8 54 6 36 Z" fill="#B7793F"/><path d="M8 39 Q32 46 56 39 M10 45 Q32 51 54 45 M14 50 Q32 55 50 50" fill="none" stroke="#8B5A2B" stroke-width="2" stroke-linecap="round"/><path d="M5 36 Q32 43 59 36" fill="none" stroke="#8B5A2B" stroke-width="3" stroke-linecap="round"/><path d="M12 38 L6 33 M52 38 L59 32 M20 41 L17 35" stroke="#8B5A2B" stroke-width="2" stroke-linecap="round"/></svg>`;
const PICS = {
  A:[['🍎','apple'],['🐜','ant'],['🥑','avocado'],['✈️','airplane']],
  B:[['🎈','balloon'],['🐻','bear'],['🍌','banana'],['🐝','bee'],['🚌','bus'],['🦋','butterfly']],
  C:[['🐱','cat'],['🎂','cake'],['🚗','car'],['🐮','cow'],['🥕','carrot'],['🍪','cookie']],
  D:[['🐶','dog'],['🦆','duck'],['🐬','dolphin'],['🍩','donut'],['🥁','drum']],
  E:[['🐘','elephant'],['🥚','egg'],['🦅','eagle'],['🌍','Earth']],
  F:[['🐟','fish'],['🐸','frog'],['🌸','flower'],['🦊','fox']],
  G:[['🍇','grapes'],['🦒','giraffe'],['🎁','gift'],['🎸','guitar'],['🐐','goat']],
  H:[['🐴','horse'],['🏠','house'],['❤️','heart'],['🎩','hat'],['🦔','hedgehog'],['🐹','hamster']],
  I:[['🍦','ice cream'],['🏝️','island'],['⛸️','ice skate']],
  J:[['🧃','juice'],['👖','jeans'],['🧥','jacket']],
  K:[['🦘','kangaroo'],['🔑','key'],['🥝','kiwi'],['🐨','koala'],['🪁','kite']],
  L:[['🦁','lion'],['🍋','lemon'],['🍃','leaf'],['🐞','ladybug'],['🍭','lollipop']],
  M:[['🐵','monkey'],['🌙','moon'],['🐭','mouse'],['🍄','mushroom'],['🥛','milk']],
  N:[[NEST,'nest'],['🥜','nut'],['📓','notebook'],['🍜','noodles']],
  O:[['🍊','orange'],['🦉','owl'],['🐙','octopus']],
  P:[['🐷','pig'],['🐧','penguin'],['🍕','pizza'],['🍐','pear'],['🐼','panda'],['🍍','pineapple']],
  Q:[['👸','queen'],['❓','question']],
  R:[['🐰','rabbit'],['🌈','rainbow'],['🚀','rocket'],['🤖','robot'],['🌹','rose']],
  S:[['☀️','sun'],['⭐','star'],['🐌','snail'],['🍓','strawberry'],['⛄','snowman'],['🐑','sheep']],
  T:[['🐯','tiger'],['🌳','tree'],['🚂','train'],['🐢','turtle'],['🍅','tomato'],['🧸','teddy bear']],
  U:[['☂️','umbrella'],['🦄','unicorn'],['🛸','UFO']],
  V:[['🎻','violin'],['🚐','van']],
  W:[['🐳','whale'],['🍉','watermelon'],['⌚','watch']],
  X:[[XYLOPHONE,'xylophone'],['🎄','Xmas tree']],
  Y:[['🪀','yo-yo'],['🧶','yarn'],['⛵','yacht']],
  Z:[['🦓','zebra'],[ZERO,'zero']]
};
const PAIR_COLORS = [
  ['#6C5CE7','#F0EDFF'],['#16A3A0','#E3F7F6'],['#FF6B4A','#FFEFE9'],
  ['#2D9CDB','#E6F3FB'],['#FF5D9E','#FFE9F2'],['#C98A12','#FFF4D6']
];

const boardEl = document.getElementById('board');
const leftEl = document.getElementById('pairsLeft');
const rightEl = document.getElementById('pairsRight');
const overlay = document.getElementById('overlay');

let letters = [], pics = {}, opened = [], matched = 0, locked = false;
let moves = 0, startTime = 0;   // спроба = відкрито дві картки; час — від першого перевороту
// Межі для зірок (12 пар)
const STARS_3 = 20, STARS_2 = 30;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---------- Вимова ---------- */
let soundOn = true;
try{ soundOn = localStorage.getItem('memo-alphabet-sound') !== 'off'; }catch(e){}
const soundBtn = document.getElementById('soundBtn');
function renderSound(){
  soundBtn.setAttribute('aria-pressed', soundOn);
  soundBtn.querySelector('.long').textContent = soundOn ? '🔊 Вимова' : '🔇 Без вимови';
  soundBtn.querySelector('.short').textContent = soundOn ? '🔊' : '🔇';
}
soundBtn.addEventListener('click', ()=>{
  soundOn = !soundOn;
  if(!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  try{ localStorage.setItem('memo-alphabet-sound', soundOn ? 'on' : 'off'); }catch(e){}
  renderSound();
});
renderSound();

let enVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  enVoice = voices.find(v=>v.lang==='en-GB') || voices.find(v=>v.lang && v.lang.startsWith('en')) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.addEventListener?.('voiceschanged', pickVoice); }
function say(letter, phrase){
  if(!soundOn || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(phrase ? letter : SPEAK[letter.toUpperCase()]);
    u.lang = enVoice?.lang || 'en-GB';
    if(enVoice) u.voice = enVoice;
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Гра ---------- */
function newGame(){
  letters = shuffle(ALPHABET.slice()).slice(0, PAIRS);
  pics = {};
  letters.forEach(L=>{ const v = PICS[L]; pics[L] = v[Math.floor(Math.random()*v.length)]; });
  opened = []; matched = 0; locked = false; moves = 0; startTime = 0;
  overlay.classList.remove('show');

  const cards = shuffle(letters.flatMap(L => [
    { pair:L, text:L },
    { pair:L, text:L.toLowerCase() }
  ]));
  // Пари в колонках — за абеткою: перша половина ліворуч, друга праворуч
  const sorted = letters.slice().sort();
  const chip = L => `<div class="pair-chip" id="chip-${L}">${L}${L.toLowerCase()}</div>`;
  leftEl.innerHTML  = sorted.slice(0, PAIRS/2).map(chip).join('');
  rightEl.innerHTML = sorted.slice(PAIRS/2).map(chip).join('');

  boardEl.innerHTML = '';
  cards.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'card';
    btn.setAttribute('aria-label', 'Закрита картка');
    btn.innerHTML = `<div class="flip-inner">
        <div class="flip-front"><span>Aa</span></div>
        <div class="flip-back"><span class="face"><span class="pic">${pics[c.pair][0]}</span><span class="letter">${c.text}</span></span><span class="name"></span></div>
      </div>`;
    btn.addEventListener('click', ()=>flip(btn, c));
    boardEl.appendChild(btn);
  });
}

function flip(btn, c){
  if(locked || btn.disabled || opened.some(o=>o.btn===btn)) return;
  if(!startTime) startTime = Date.now();
  btn.querySelector('.flip-inner').classList.add('flipped');
  btn.setAttribute('aria-label', `Літера ${c.text}, ${pics[c.pair][1]}`);
  opened.push({ btn, c });
  const [a, b] = opened;
  // Пару знайдено — кажемо літеру й слово-малюнок, інакше лише літеру
  if(b && a.c.pair === b.c.pair) say(`${SPEAK[c.pair]}, ${pics[c.pair][1]}`, true);
  else say(c.pair);
  if(opened.length < 2) return;
  moves++;

  if(a.c.pair === b.c.pair){
    const [col, light] = PAIR_COLORS[matched % PAIR_COLORS.length];
    [a.btn, b.btn].forEach(el=>{
      el.disabled = true;
      el.classList.add('matched');
      el.style.setProperty('--card-c', col);
      el.style.setProperty('--card-c-light', light);
      el.querySelector('.name').textContent = `${NAMES[a.c.pair]} · ${pics[a.c.pair][1]}`;
    });
    const chipEl = document.getElementById(`chip-${a.c.pair}`);
    chipEl.style.setProperty('--chip-c', col);
    chipEl.style.setProperty('--chip-light', light);
    chipEl.classList.add('found');
    opened = [];
    matched++;
    if(matched === PAIRS) setTimeout(win, 800);
  } else {
    locked = true;
    [a.btn, b.btn].forEach(el=>el.classList.add('wrong'));
    setTimeout(()=>{
      [a.btn, b.btn].forEach(el=>{
        el.classList.remove('wrong');
        el.querySelector('.flip-inner').classList.remove('flipped');
        el.setAttribute('aria-label', 'Закрита картка');
      });
      opened = []; locked = false;
    }, 1000);
  }
}

function win(){
  say('Well done!', true);
  confetti();
  const sec = Math.round((Date.now() - startTime) / 1000);
  const stars = moves <= STARS_3 ? 3 : moves <= STARS_2 ? 2 : 1;
  document.getElementById('winTitle').textContent = ['Усі пари знайдено!','Молодець!','Неймовірна пам\'ять!'][stars-1];
  document.getElementById('wStars').innerHTML = [1,2,3].map(i=>`<span class="${i<=stars?'':'dim'}">⭐</span>`).join('');
  document.getElementById('wMoves').textContent = moves;
  document.getElementById('wTime').textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  overlay.classList.add('show');
  document.getElementById('againBtn').focus();
}

function confetti(){
  const colors = ['#6C5CE7','#16A3A0','#FF6B4A','#FFC93C','#FF5D9E','#2D9CDB'];
  for(let i=0;i<70;i++){
    const d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = Math.random()*100 + 'vw';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = (2 + Math.random()*2) + 's';
    d.style.animationDelay = Math.random()*0.6 + 's';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 5000);
  }
}

document.getElementById('restartBtn').addEventListener('click', newGame);
document.getElementById('againBtn').addEventListener('click', newGame);

newGame();
</script>
