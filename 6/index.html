<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6 клас · Інформатика — Теми уроків</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5FB; --ink:#1B1B3A; --ink-soft:#514F72; --surface:#FFFFFF; --line:#E4E1F5;
    --purple:#6C5CE7; --purple-dark:#5340c9; --teal:#16A3A0; --coral:#FF6B4A; --yellow:#FFC93C; --blue:#2D9CDB;
    --radius-s:10px; --radius-m:16px; --radius-l:26px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Nunito Sans',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.headline{font-family:'Baloo 2',sans-serif; font-weight:700; margin:0; color:var(--ink);}
  a{color:inherit;}
  .container{max-width:820px; margin:0 auto; padding:0 24px;}

  .topbar{padding:18px 24px; border-bottom:1px solid var(--line); background:rgba(246,245,251,.9); position:sticky; top:0; backdrop-filter:blur(6px);}
  .topbar-inner{max-width:820px; margin:0 auto;}
  .back-link{font-family:'Baloo 2',sans-serif; font-weight:600; font-size:14px; color:var(--purple-dark); text-decoration:none;}
  .back-link:hover{text-decoration:underline;}

  .hero{padding:40px 24px 28px;}
  .hero-eyebrow{font-family:'Baloo 2',sans-serif; font-size:14px; font-weight:600; color:var(--purple-dark); margin-bottom:8px;}
  .hero h1{font-size:30px; line-height:1.2; margin-bottom:10px;}
  .hero p{color:var(--ink-soft); font-size:15.5px; max-width:60ch;}

  .theme-card{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-l); padding:20px 22px; margin-bottom:18px;}
  .theme-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px; flex-wrap:wrap;}
  .theme-head h2{font-size:17px;}
  .theme-hours{font-family:'Baloo 2',sans-serif; font-weight:600; font-size:12.5px; color:var(--ink-soft); background:var(--bg); border-radius:999px; padding:3px 10px; white-space:nowrap;}

  .lesson-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line);}
  .lesson-row:first-of-type{border-top:none;}
  .lesson-num{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:var(--ink-soft); width:22px; flex-shrink:0;}
  .lesson-body{flex:1; min-width:0;}
  .lesson-title{font-size:14.5px;}
  .lesson-action{flex-shrink:0;}
  .btn-open{font-family:'Baloo 2',sans-serif; font-weight:600; font-size:13px; background:var(--purple); color:#fff; text-decoration:none; padding:8px 14px; border-radius:999px; white-space:nowrap; transition:background .15s ease;}
  .btn-open:hover{background:var(--purple-dark);}
  .tag-soon{font-family:'Baloo 2',sans-serif; font-weight:600; font-size:12px; color:var(--ink-soft); background:var(--bg); border:1px solid var(--line); padding:6px 12px; border-radius:999px; white-space:nowrap;}

  footer{padding:36px 24px 60px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
</style>
</head>
<body>

<div class="topbar"><div class="topbar-inner"><a class="back-link" href="../index.html">← Усі класи</a></div></div>

<section class="hero container">
  <div class="hero-eyebrow">6 клас · Інформатика</div>
  <h1>Теми уроків</h1>
  <p>Урок із кнопкою «Відкрити» вже має готову інтерактивну версію. Дві теми вже об'єднують по кілька пунктів плану в один урок.</p>
</section>

<div class="container" id="plan"></div>

<footer>6 клас · Інформатика · Інтерактивні уроки</footer>

<script>
const PLAN = [
  { title: "1. Електронна пошта", hours: "5 год", lessons: [
    { title: "Поштові служби Інтернету", link: "lesson-email-basics/index.html" },
    { title: "Створення електронної скриньки", link: "lesson-email-basics/index.html" },
    { title: "Надсилання, отримання, перенаправлення повідомлень. Пересилання файлів", link: "lesson-email-basics/index.html" },
    { title: "Безпека електронного листування. Основні ознаки спаму й фішингу", link: "lesson-email-safety/index.html" },
    { title: "Етикет електронного листування та безпека", link: "lesson-email-etiquette/index.html" }
  ]},
  { title: "2. Спільна робота з документами. Текстові документи", hours: "11 год", lessons: [
    { title: "Мої інструменти для навчання. Персональне навчальне середовище та хмарні сервіси", link: "lesson-learning-tools/index.html" },
    { title: "Інтернет-ресурси для спільної роботи. Спільний доступ, колективне редагування, коментарі та історія змін" },
    { title: "Текстові документи. Об'єкти текстового документа та їх властивості" },
    { title: "Правила введення і редагування текстів. Перевірка правопису, пошук та заміна" },
    { title: "Форматування текстових об'єктів. Параметри шрифту" },
    { title: "Форматування абзаців: вирівнювання, відступи, міжрядковий інтервал" },
    { title: "Форматування списків" },
    { title: "Додавання зображень у текстовий документ" },
    { title: "Додавання та форматування таблиць у текстовому документі" }
  ]},
  { title: "3. Моделювання в електронних таблицях", hours: "6 год", lessons: [
    { title: "Поняття електронної таблиці. Табличний процесор, його призначення та об'єкти" },
    { title: "Введення, редагування та автозаповнення даних у комірках" },
    { title: "Форматування таблиць. Формати даних, межі та заливка комірок" },
    { title: "Поняття про формули в електронній таблиці. Обчислення за формулами" },
    { title: "Наочне представлення даних: діаграми" },
    { title: "Застосування моделювання на практиці" }
  ]},
  { title: "4. Алгоритми і програми", hours: "13 год", lessons: [
    { title: "Повторення базових алгоритмічних структур. Об'єкти та їх властивості у програмному середовищі" },
    { title: "Події та їх обробники. Проєкти із взаємодією декількох об'єктів" },
    { title: "Повторення та поглиблення знань про циклічні алгоритми" },
    { title: "Повторення та поглиблення знань про алгоритми з розгалуженням" },
    { title: "Вкладені цикли. Побудова орнаментів та візерунків" },
    { title: "Вкладені розгалуження. Алгоритми з кількома умовами" },
    { title: "Розгалуження, вкладені в цикли. Створення складних алгоритмів" },
    { title: "Цікаві випробування. Комплексне розв'язування алгоритмічних задач" },
    { title: "Знайомство з micro:bit та середовищем MakeCode. Будова плати та світлодіодна матриця" },
    { title: "Обробка подій для кнопок A, B, A+B" },
    { title: "Датчики micro:bit (акселерометр, датчик струшування) та алгоритми з розгалуженням у MakeCode" },
    { title: "Програмування звуку, змінних та розробка пристрою на micro:bit" }
  ]}
];

const root = document.getElementById('plan');
PLAN.forEach(theme=>{
  const card = document.createElement('div');
  card.className = 'theme-card';
  const head = document.createElement('div');
  head.className = 'theme-head';
  head.innerHTML = `<h2>${theme.title}</h2><span class="theme-hours">${theme.hours}</span>`;
  card.appendChild(head);

  theme.lessons.forEach((lesson, i)=>{
    const row = document.createElement('div');
    row.className = 'lesson-row';
    const action = lesson.link
      ? `<a class="btn-open" href="${lesson.link}">Відкрити →</a>`
      : `<span class="tag-soon">Скоро</span>`;
    row.innerHTML = `
      <span class="lesson-num">${i+1}</span>
      <div class="lesson-body"><div class="lesson-title">${lesson.title}</div></div>
      <div class="lesson-action">${action}</div>`;
    card.appendChild(row);
  });
  root.appendChild(card);
});
</script>

</body>
</html>
